<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login – LabStock AI</title>
    <!-- Custom Academic Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a1c36 0%, #0f2b48 50%, #1e3a8a 100%);
            padding: 1.5rem;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .login-header {
            background-color: var(--navy-dark);
            color: #ffffff;
            padding: 2rem 2rem 1.75rem 2rem;
            text-align: center;
            border-bottom: 3px solid var(--blue-accent);
        }

        .login-brand-icon {
            width: 52px;
            height: 52px;
            background: var(--navy-light);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-md);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }

        .login-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.01em;
        }

        .login-subtitle {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .login-body {
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--navy-primary);
            margin-bottom: 0.4rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 0.9rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.92rem;
            color: var(--text-primary);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--blue-accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--navy-primary);
            color: #ffffff;
            border: none;
            padding: 0.85rem;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: var(--blue-accent);
        }

        .demo-credential-box {
            background-color: var(--blue-soft);
            border: 1px dashed #93c5fd;
            border-radius: var(--radius-sm);
            padding: 0.85rem;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--navy-dark);
        }

        .demo-credential-box strong {
            color: var(--blue-accent);
        }

        .login-footer-links {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.82rem;
        }

        .login-footer-links a {
            color: var(--navy-light);
            text-decoration: none;
            font-weight: 500;
        }

        .login-footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="login-page">

    <div class="login-card">
        <div class="login-header">
            <div class="login-brand-icon">LS</div>
            <h1 class="login-title">LabStock AI</h1>
            <div class="login-subtitle">Engineering Laboratory Management</div>
        </div>

        <div class="login-body">
            {% if error %}
            <div style="background-color: #fee2e2; border: 1px solid #f87171; color: #b91c1c; padding: 0.75rem 1rem; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 1.25rem;">
                <strong>Authentication Failed:</strong> {{ error }}
            </div>
            {% endif %}
            <form action="{{ url_for('views.login') }}" method="POST">
                <div class="form-group">
                    <label class="form-label" for="username">Faculty / Admin ID</label>
                    <input class="form-input" type="text" id="username" name="username" placeholder="e.g. admin@engg.edu" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-input" type="password" id="password" name="password" placeholder="••••••••••••" required>
                </div>

                <button type="submit" class="btn-submit">Sign In to Laboratory Console</button>
            </form>

            <div class="demo-credential-box">
                <div><strong>Evaluation Demo Login:</strong></div>
                <div>User ID: <code>admin@engg.edu</code> | Pass: <code>admin123</code></div>
            </div>

            <div class="login-footer-links">
                <a href="{{ url_for('views.dashboard') }}">&larr; Return to Dashboard Overview</a>
            </div>
        </div>
    </div>

</body>
</html>
